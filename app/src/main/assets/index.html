<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pocket Portal</title>
<style>
  :root { --bg:#0b0e12; --panel:#161c23; --line:#26303b; --text:#e8edf2; --muted:#9aa6b2; --accent:#4fa3ff; --warn:#ffb74d; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; min-height:100vh; background:var(--bg); color:var(--text); font:16px/1.4 system-ui, sans-serif; overflow:hidden; }
  body { display:flex; flex-direction:column; }
  #stage { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; position:relative; }
  canvas { touch-action:none; cursor:pointer; border-radius:18px; background:#000; box-shadow:0 0 0 1px var(--line); }
  #bar { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding:10px; background:var(--panel); border-top:1px solid var(--line); }
  button { font:inherit; color:var(--text); background:#212a34; border:1px solid var(--line); border-radius:12px; padding:12px 18px; min-width:64px; cursor:pointer; }
  button:hover { background:#2b3642; }
  button:active { background:var(--accent); color:#000; }
  #typebar { display:none; gap:8px; padding:10px; background:var(--panel); border-top:1px solid var(--line); }
  #typebar.open { display:flex; }
  #typebar input { flex:1; font:inherit; color:var(--text); background:#0f1419; border:1px solid var(--line); border-radius:12px; padding:12px; }
  #status { position:absolute; top:12px; left:50%; transform:translateX(-50%); background:rgba(22,28,35,.92); border:1px solid var(--line); border-radius:999px; padding:6px 16px; color:var(--muted); font-size:14px; white-space:nowrap; }
  #status.warn { color:var(--warn); }
  #status:empty { display:none; }
  #stats { position:absolute; top:12px; right:12px; background:rgba(22,28,35,.85); border:1px solid var(--line); border-radius:10px; padding:4px 10px; color:var(--muted); font:13px/1.4 ui-monospace, monospace; white-space:nowrap; pointer-events:none; }
  #stats b { color:var(--text); font-weight:600; }
  #stats:empty, #stats.off { display:none; }
  #pin { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:var(--bg); }
  #pin.open { display:flex; }
  #pin form { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:28px; width:min(360px, calc(100% - 32px)); display:flex; flex-direction:column; gap:14px; }
  #pin h1 { margin:0; font-size:22px; }
  #pin p { margin:0; color:var(--muted); }
  #pin input { font:28px/1 ui-monospace, monospace; letter-spacing:.3em; text-align:center; color:var(--text); background:#0f1419; border:1px solid var(--line); border-radius:12px; padding:12px; }
  #pinError { color:var(--warn); min-height:1.4em; }
  /* Phone notifications as toasts, newest on top, and the phone's battery. */
  #toasts { position:absolute; top:52px; right:12px; width:min(360px, calc(100% - 24px)); display:flex; flex-direction:column; gap:8px; z-index:3; pointer-events:none; }
  .toast { pointer-events:auto; background:rgba(22,28,35,.96); border:1px solid var(--line); border-radius:14px; padding:12px; box-shadow:0 6px 24px rgba(0,0,0,.45); animation:toastIn .18s ease-out; }
  .toast.out { opacity:0; transform:translateX(12px); transition:opacity .2s, transform .2s; }
  @keyframes toastIn { from { opacity:0; transform:translateX(12px); } }
  .toast .head { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px; }
  .toast .head img { width:20px; height:20px; border-radius:5px; }
  .toast .head .app { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .toast .x { background:none; border:none; color:var(--muted); padding:2px 6px; min-width:0; font-size:16px; }
  .toast .title { font-weight:600; margin-top:6px; overflow-wrap:anywhere; }
  .toast .body { color:#c9d2db; font-size:14px; margin-top:2px; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  .toast .acts { display:flex; gap:8px; margin-top:10px; }
  .toast .acts button { padding:8px 14px; min-width:0; font-size:14px; }
  .toast form { display:flex; gap:8px; margin-top:10px; }
  .toast form input { flex:1; min-width:0; font:inherit; font-size:14px; color:var(--text); background:#0f1419; border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  .toast .note { color:var(--accent); font-size:13px; margin-top:8px; }
  .toast.battery { border-color:var(--warn); }
  #battery { position:absolute; top:12px; left:12px; background:rgba(22,28,35,.85); border:1px solid var(--line); border-radius:10px; padding:4px 10px; color:var(--muted); font:13px/1.4 ui-monospace, monospace; pointer-events:none; }
  #battery.low { color:var(--warn); }
  #battery:empty { display:none; }
  /* DeX: our own mouse pointer, since injected mouse events don't show Android's. */
  body.dex canvas { cursor:none; border-radius:6px; }
  #cursor { position:absolute; left:0; top:0; width:22px; height:22px; pointer-events:none; display:none; z-index:2; }
  #cursor.on { display:block; }
  #cursor svg { position:absolute; left:0; top:0; filter:drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
  #cursor .ring { position:absolute; left:-14px; top:-14px; width:28px; height:28px; border-radius:50%; border:3px solid var(--accent); opacity:0; transform:scale(.4); }
  #cursor.hold .ring { opacity:1; transform:scale(1); transition:transform .5s linear, opacity .1s; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="screen" width="9" height="16"></canvas>
  <div id="status">Connecting…</div>
  <div id="stats"></div>
  <div id="battery"></div>
  <div id="toasts"></div>
  <div id="cursor"><div class="ring"></div><svg width="22" height="22" viewBox="0 0 22 22"><path d="M2 1.5v16.2l4.3-4.1 2.8 6.4 2.9-1.3-2.8-6.3h6z" fill="#fff" stroke="#000" stroke-width="1.3" stroke-linejoin="round"/></svg></div>
  <div id="pin">
    <form id="pinForm">
      <h1>Pocket Portal</h1>
      <p>Enter the PIN shown in the Pocket Portal app on your phone.</p>
      <input id="pinInput" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="••••••">
      <div id="pinError"></div>
      <button type="submit">Connect</button>
    </form>
  </div>
</div>
<div id="typebar">
  <input id="text" placeholder="Type here, press Enter to send to the phone" autocomplete="off">
  <button data-send="backspace" title="Delete last character">⌫</button>
  <button data-send="enter" title="Enter / Go">⏎</button>
</div>
<div id="bar">
  <button data-key="back">◀ Back</button>
  <button data-key="home">● Home</button>
  <button data-key="recents">▮▮ Recents</button>
  <button data-key="notifications">Notifications</button>
  <button data-key="quick">Quick settings</button>
  <button id="kbd">⌨ Keyboard</button>
  <button id="sound" hidden>🔊 Sound</button>
  <button id="statsBtn">⏱ Stats</button>
  <button id="alertsBtn" hidden>🔔 Alerts</button>
  <button id="full">⛶ Full screen</button>
</div>
<script>
(() => {
  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const statusEl = document.getElementById('status');
  const pinBox = document.getElementById('pin');
  let ws = null, inputOn = true, drawing = Promise.resolve(), retry = null;

  const store = {
    get() { try { return localStorage.getItem('pocketportal-pin') || ''; } catch { return ''; } },
    set(v) { try { v ? localStorage.setItem('pocketportal-pin', v) : localStorage.removeItem('pocketportal-pin'); } catch {} },
  };
  let pin = location.hash.slice(1) || store.get();

  function setStatus(text, warn) {
    statusEl.textContent = text;
    statusEl.classList.toggle('warn', !!warn);
  }
  function showStatus() {
    setStatus(inputOn ? '' : 'View only: switch on "Pocket Portal remote touch" on the phone to control it', !inputOn);
  }

  // Phone audio arrives as 40 ms chunks of 16-bit stereo PCM, each scheduled
  // right after the previous one.
  const sound = {
    ctx: null, next: 0, rate: 48000, available: false,
    muted: (() => { try { return localStorage.getItem('pocketportal-muted') === '1'; } catch { return false; } })(),
    button: document.getElementById('sound'),
    start() {
      if (this.muted || !this.available) return;
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC({ sampleRate: this.rate });
      }
      if (this.ctx.state === 'suspended') this.ctx.resume().then(() => this.label(), () => {});
      this.label();
    },
    label() {
      const b = this.button;
      b.hidden = !this.available;
      if (this.muted) b.textContent = '🔇 Muted';
      else if (!this.ctx || this.ctx.state !== 'running') b.textContent = '🔈 Tap for sound';
      else b.textContent = '🔊 Sound';
    },
    toggle() {
      this.muted = !this.muted;
      try { localStorage.setItem('pocketportal-muted', this.muted ? '1' : '0'); } catch {}
      send({ t: 'audio', on: !this.muted });
      if (this.muted) { if (this.ctx) this.ctx.suspend(); this.label(); }
      else this.start();
    },
    play(buffer) {
      const ctx = this.ctx;
      if (this.muted || !ctx || ctx.state !== 'running') return;
      const pcm = new Int16Array(buffer.slice(1)); // skip the type byte; Int16Array needs an even offset
      const frames = pcm.length >> 1;
      const out = ctx.createBuffer(2, frames, this.rate);
      const left = out.getChannelData(0), right = out.getChannelData(1);
      for (let i = 0; i < frames; i++) { left[i] = pcm[2 * i] / 32768; right[i] = pcm[2 * i + 1] / 32768; }
      const now = ctx.currentTime;
      // Start ~80 ms ahead to absorb Wi-Fi jitter; if the clocks drift too far apart, resync.
      if (this.next < now + 0.02 || this.next > now + 0.4) this.next = now + 0.08;
      const src = ctx.createBufferSource();
      src.buffer = out;
      src.connect(ctx.destination);
      src.start(this.next);
      this.next += out.duration;
    },
  };
  sound.button.addEventListener('click', e => { e.stopPropagation(); if (sound.muted || (sound.ctx && sound.ctx.state === 'running')) sound.toggle(); else sound.start(); });
  // Browsers only allow sound after the user interacts with the page.
  document.addEventListener('pointerdown', () => sound.start(), { capture: true });

  function askPin(message) {
    pinBox.classList.add('open');
    document.getElementById('pinError').textContent = message || '';
    document.getElementById('pinInput').focus();
  }
  document.getElementById('pinForm').addEventListener('submit', e => {
    e.preventDefault();
    pin = document.getElementById('pinInput').value.trim();
    if (!pin) return;
    pinBox.classList.remove('open');
    connect();
  });

  // Clock sync with the phone, for the latency readout. Each round trip gives an
  // estimate of (phone clock − page clock); the one with the shortest round trip wins.
  const clock = {
    samples: [], offset: null,
    ping() { send({ t: 'sync', c: performance.now() }); },
    pong(msg) {
      const now = performance.now(), rtt = now - msg.c;
      if (!(rtt >= 0)) return;
      this.samples.push({ rtt, offset: msg.s / 1000 - (msg.c + rtt / 2) });
      if (this.samples.length > 10) this.samples.shift();
      this.offset = this.samples.reduce((a, b) => (b.rtt < a.rtt ? b : a)).offset;
    },
    reset() { this.samples = []; this.offset = null; },
  };

  // What the stats pill shows: codec, frames drawn per second, bitrate received, and
  // latency from the moment the phone captured a frame to the moment it's drawn here.
  const stats = {
    el: document.getElementById('stats'), codec: '', frames: 0, bytes: 0, latency: null,
    on: (() => { try { return localStorage.getItem('pocketportal-stats') !== '0'; } catch { return true; } })(),
    frame(captureUs) {
      this.frames++;
      if (captureUs == null || clock.offset == null) return;
      const ms = performance.now() + clock.offset - captureUs / 1000;
      if (ms < 0 || ms > 5000) return; // clocks not comparable on this phone
      this.latency = this.latency == null ? ms : this.latency * 0.9 + ms * 0.1;
    },
    tick() {
      const parts = [];
      if (this.codec) parts.push(`<b>${this.codec}</b>`);
      parts.push(`${this.frames} fps`, `${(this.bytes * 8 / 1e6).toFixed(1)} Mbps`);
      if (this.latency != null) parts.push(`<b>${Math.round(this.latency)} ms</b>`);
      this.el.innerHTML = ws && ws.readyState === 1 && (this.frames || this.bytes) ? parts.join(' · ') : '';
      this.el.classList.toggle('off', !this.on);
      this.frames = 0; this.bytes = 0;
    },
    toggle() {
      this.on = !this.on;
      try { localStorage.setItem('pocketportal-stats', this.on ? '1' : '0'); } catch {}
      this.el.classList.toggle('off', !this.on);
    },
  };
  setInterval(() => stats.tick(), 1000);
  document.getElementById('statsBtn').addEventListener('click', () => stats.toggle());

  // The phone's notifications pop up as toasts: reply right here (messaging apps),
  // open on the phone (or DeX), or dismiss. Low battery and charger changes too.
  // Notification text comes from other apps, so it only ever goes in as text.
  const toasts = {
    box: document.getElementById('toasts'), btn: document.getElementById('alertsBtn'),
    on: (() => { try { return localStorage.getItem('pocketportal-alerts') !== '0'; } catch { return true; } })(),
    byKey: new Map(), MAX: 3, SHOW_MS: 9000,
    el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; },
    label() { this.btn.textContent = this.on ? '🔔 Alerts' : '🔕 Alerts'; },
    toggle() {
      this.on = !this.on;
      try { localStorage.setItem('pocketportal-alerts', this.on ? '1' : '0'); } catch {}
      if (!this.on) [...this.byKey.keys()].forEach(k => this.remove(k));
      this.label();
    },
    // A toast stays while the pointer is on it or a reply is being typed, else fades after SHOW_MS.
    timer(t) {
      clearTimeout(t._hide);
      if (t._busy || t.matches(':hover')) return;
      t._hide = setTimeout(() => this.remove(t._key), this.SHOW_MS);
    },
    show(key, build) {
      if (!this.on) return;
      const old = this.byKey.get(key);
      const t = this.el('div', 'toast');
      t._key = key;
      build(t);
      t.addEventListener('pointerenter', () => clearTimeout(t._hide));
      t.addEventListener('pointerleave', () => this.timer(t));
      if (old) { clearTimeout(old._hide); old.remove(); this.byKey.delete(key); }
      this.box.prepend(t);
      this.byKey.set(key, t); // Map order = age, newest last
      while (this.byKey.size > this.MAX) this.remove(this.byKey.keys().next().value);
      this.timer(t);
    },
    remove(key) {
      const t = this.byKey.get(key);
      if (!t) return;
      this.byKey.delete(key);
      clearTimeout(t._hide);
      t.classList.add('out');
      setTimeout(() => t.remove(), 220);
    },
    head(t, app, icon, onClose) {
      const head = this.el('div', 'head');
      if (icon && /^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(icon)) { const img = this.el('img'); img.src = icon; img.alt = ''; head.append(img); }
      head.append(this.el('span', 'app', app));
      const x = this.el('button', 'x', '✕'); x.title = 'Dismiss';
      x.addEventListener('click', onClose);
      head.append(x);
      t.append(head);
    },
    notif(n) {
      this.show(n.key, t => {
        this.head(t, n.app || 'Phone', n.icon, () => { send({ t: 'dismiss', key: n.key }); this.remove(n.key); });
        if (n.title) t.append(this.el('div', 'title', n.title));
        if (n.text) t.append(this.el('div', 'body', n.text));
        const acts = this.el('div', 'acts');
        if (n.reply) {
          const b = this.el('button', '', '↩ Reply');
          b.addEventListener('click', () => {
            acts.remove();
            t._busy = true; clearTimeout(t._hide);
            const form = this.el('form'), input = this.el('input');
            input.placeholder = 'Reply…'; input.autocomplete = 'off'; input.maxLength = 2000;
            const go = this.el('button', '', 'Send'); go.type = 'submit';
            form.append(input, go);
            form.addEventListener('submit', e => {
              e.preventDefault();
              if (!input.value.trim()) return;
              send({ t: 'reply', key: n.key, s: input.value });
              form.replaceWith(this.el('div', 'note', 'Sent'));
              t._busy = false;
              t._hide = setTimeout(() => this.remove(n.key), 1500);
            });
            input.addEventListener('keydown', e => { if (e.key === 'Escape') { t._busy = false; this.remove(n.key); } });
            t.append(form);
            input.focus();
          });
          acts.append(b);
        }
        if (n.open) {
          const b = this.el('button', '', dex ? 'Open in DeX' : 'Open on phone');
          b.addEventListener('click', () => { send({ t: 'open', key: n.key }); this.remove(n.key); });
          acts.append(b);
        }
        if (acts.childElementCount) t.append(acts);
      });
    },
    gone(key) { const t = this.byKey.get(key); if (t && !t._busy) this.remove(key); },
  };
  toasts.btn.addEventListener('click', () => toasts.toggle());
  toasts.label();

  const battery = {
    el: document.getElementById('battery'), level: -1, charging: false,
    update(msg) {
      const was = this.level, wasCharging = this.charging;
      this.level = msg.level; this.charging = !!msg.charging;
      if (this.level < 0) { this.el.textContent = ''; return; }
      this.el.textContent = `${this.charging ? '⚡' : '🔋'} ${this.level}%`;
      this.el.classList.toggle('low', !this.charging && this.level <= 15);
      if (was < 0) return; // first report after connecting: no toast
      const say = text => toasts.show('battery', t => {
        t.classList.add('battery');
        toasts.head(t, 'Phone battery', null, () => toasts.remove('battery'));
        t.append(toasts.el('div', 'title', text));
      });
      if (this.charging !== wasCharging) say(this.charging ? `Charging · ${this.level}%` : `Charger unplugged · ${this.level}%`);
      else if (!this.charging && [20, 10, 5].some(n => was > n && this.level <= n)) say(`Battery low · ${this.level}%`);
    },
  };

  // H.265 or H.264 video, decoded by the headset's hardware through WebCodecs. Browsers
  // only offer WebCodecs on secure (HTTPS) pages; without it the phone sends JPEG frames.
  // If decoding fails, the page reconnects asking for the next codec down.
  const video = {
    checked: false, h265: false, h264: false, current: null, decoder: null, waitForKey: true,
    async supports(codec) {
      try { return !!(await VideoDecoder.isConfigSupported({ codec, optimizeForLatency: true })).supported; } catch { return false; }
    },
    async check() {
      if (!this.checked) {
        this.checked = true;
        if (window.isSecureContext && 'VideoDecoder' in window) {
          this.h265 = await this.supports('hvc1.1.6.L123.B0');
          this.h264 = await this.supports('avc1.42e01f');
        }
      }
      return this.h265 ? 'h265' : this.h264 ? 'h264' : null;
    },
    configure(msg) {
      if (this.decoder && this.decoder.state !== 'closed') this.decoder.close();
      this.current = msg.name || 'H.264';
      stats.codec = this.current;
      this.decoder = new VideoDecoder({ output: f => this.draw(f), error: e => this.fail(e) });
      this.decoder.configure({
        codec: msg.codec, codedWidth: msg.width, codedHeight: msg.height,
        optimizeForLatency: true, hardwareAcceleration: 'prefer-hardware',
      });
      this.waitForKey = true;
    },
    decode(buffer) {
      const d = this.decoder;
      if (!d || d.state !== 'configured') return;
      const bytes = new Uint8Array(buffer);
      const key = (bytes[1] & 1) === 1;
      if (this.waitForKey && !key) return;
      this.waitForKey = false;
      let timestamp = 0;
      for (let i = 2; i < 10; i++) timestamp = timestamp * 256 + bytes[i];
      try {
        d.decode(new EncodedVideoChunk({ type: key ? 'key' : 'delta', timestamp, data: bytes.subarray(10) }));
      } catch (e) { this.fail(e); }
    },
    draw(frame) {
      if (canvas.width !== frame.displayWidth || canvas.height !== frame.displayHeight) {
        canvas.width = frame.displayWidth; canvas.height = frame.displayHeight; layout();
      }
      ctx.drawImage(frame, 0, 0);
      stats.frame(frame.timestamp);
      frame.close();
    },
    // If this headset can't decode the stream after all, reconnect and ask for the next codec down.
    fail(e) {
      console.warn(`${this.current} decoding failed, trying the next codec`, e);
      if (this.current === 'H.265') this.h265 = false; else this.h264 = false;
      if (ws) ws.close();
    },
    reset() {
      if (this.decoder && this.decoder.state !== 'closed') this.decoder.close();
      this.decoder = null;
    },
  };

  async function connect() {
    clearTimeout(retry);
    if (!pin) return askPin();
    setStatus('Connecting…');
    const codec = await video.check();
    video.reset();
    clock.reset();
    stats.codec = codec ? '' : 'JPEG'; stats.latency = null;
    const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${scheme}://${location.host}/ws?k=${encodeURIComponent(pin)}${codec ? '&v=' + codec : ''}`);
    ws.binaryType = 'arraybuffer';
    // The phone only says hello after the PIN checks out, so that's when it's worth saving.
    let accepted = false, opened = false;
    ws.onopen = () => { opened = true; };
    ws.onmessage = e => {
      if (typeof e.data === 'string') {
        const msg = JSON.parse(e.data);
        if (msg.type === 'hello') {
          if (!accepted) { accepted = true; store.set(pin); }
          // A burst of clock pings to start, then occasional ones to follow drift.
          for (let i = 0; i < 5; i++) setTimeout(() => clock.ping(), i * 200);
          inputOn = msg.input; showStatus();
          sound.available = !!msg.audio;
          if (msg.rate) sound.rate = msg.rate;
          if (sound.muted) send({ t: 'audio', on: false });
          sound.start();
          sound.label();
          toasts.btn.hidden = !msg.notifications;
        } else if (msg.type === 'notif') {
          toasts.notif(msg);
        } else if (msg.type === 'notif-gone') {
          toasts.gone(msg.key);
        } else if (msg.type === 'battery') {
          battery.update(msg);
        } else if (msg.type === 'video') {
          video.configure(msg);
          setDex(!!msg.dex);
          // The headset app opens a wide window for DeX and goes back to the tall one after.
          if (window.PocketPortalApp && window.PocketPortalApp.shape) window.PocketPortalApp.shape(!!msg.dex);
        } else if (msg.type === 'sync') {
          clock.pong(msg);
        }
        return;
      }
      const data = e.data, socket = ws;
      stats.bytes += data.byteLength;
      // First byte: 0x01 sound, 0x02 H.264, anything else is a JPEG (0xFF).
      const kind = new Uint8Array(data, 0, 1)[0];
      if (kind === 0x01) return sound.play(data);
      if (kind === 0x02) return video.decode(data);
      // Decode in arrival order, then ack so the phone sends the next frame.
      drawing = drawing.then(async () => {
        try {
          const bmp = await createImageBitmap(new Blob([data], { type: 'image/jpeg' }));
          if (canvas.width !== bmp.width || canvas.height !== bmp.height) {
            canvas.width = bmp.width; canvas.height = bmp.height; layout();
          }
          ctx.drawImage(bmp, 0, 0);
          bmp.close();
          stats.frame(null);
        } catch (err) { console.warn(err); }
        if (socket.readyState === 1) socket.send('a');
      });
    };
    ws.onclose = e => {
      // A refused PIN closes with 4001; older phone builds lose that code, but they
      // also never say hello, so an accepted-then-silent close means the same thing.
      if (e.code === 4001 || (opened && !accepted)) {
        pin = ''; store.set('');
        if (window.PocketPortalApp) return window.PocketPortalApp.wrongPin();
        return askPin('Wrong PIN, try again.');
      }
      setStatus('Phone not reachable. Is Pocket Portal sharing? Retrying…', true);
      retry = setTimeout(connect, 1500);
    };
  }
  setInterval(() => { if (ws && ws.readyState === 1) ws.send('p'); }, 10000);
  setInterval(() => clock.ping(), 5000);

  function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

  // Fit the phone picture into the space above the toolbar, keeping its shape.
  function layout() {
    const r = stage.getBoundingClientRect();
    const scale = Math.min((r.width - 24) / canvas.width, (r.height - 24) / canvas.height);
    canvas.style.width = Math.max(1, canvas.width * scale) + 'px';
    canvas.style.height = Math.max(1, canvas.height * scale) + 'px';
  }
  addEventListener('resize', layout);
  layout();

  // Pointer input: a quick click is a tap, a still hold is a long press, anything else a swipe.
  let stroke = null;
  function norm(e) {
    const r = canvas.getBoundingClientRect();
    return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))];
  }
  // DeX gets a mouse instead: a pointer that hovers, click and drag, hold (or a real
  // right button) for the right-click menu, and the wheel/thumbstick scrolls.
  let dex = false, mouse = null, hoverAt = 0;
  const cursor = document.getElementById('cursor');
  const HOLD_MS = 500;
  function setDex(on) {
    if (dex === on) return;
    dex = on; mouse = null; stroke = null;
    document.body.classList.toggle('dex', on);
    cursor.className = '';
  }
  function moveCursor(e) {
    const r = stage.getBoundingClientRect(), c = canvas.getBoundingClientRect();
    const x = Math.min(c.right, Math.max(c.left, e.clientX)), y = Math.min(c.bottom, Math.max(c.top, e.clientY));
    cursor.style.transform = `translate(${x - r.left}px, ${y - r.top}px)`;
    cursor.classList.add('on');
  }
  function at(e) { const [x, y] = norm(e); return { x, y }; }
  function dexDown(e) {
    canvas.setPointerCapture(e.pointerId);
    moveCursor(e);
    if (e.button === 2) { send({ t: 'click', ...at(e), b: 'right' }); return; }
    mouse = { start: at(e), x: e.clientX, y: e.clientY, t0: performance.now(), drag: false, last: 0 };
    cursor.classList.add('hold');
  }
  function dexMove(e) {
    moveCursor(e);
    const now = performance.now();
    if (!mouse) {
      if (now - hoverAt > 33) { hoverAt = now; send({ t: 'hover', ...at(e) }); }
      return;
    }
    if (!mouse.drag && Math.hypot(e.clientX - mouse.x, e.clientY - mouse.y) > 8) {
      mouse.drag = true;
      cursor.classList.remove('hold');
      send({ t: 'mdown', ...mouse.start });
    }
    if (mouse.drag && now - mouse.last > 16) { mouse.last = now; send({ t: 'mmove', ...at(e) }); }
  }
  function dexUp(e) {
    const m = mouse; mouse = null;
    cursor.classList.remove('hold');
    if (!m) return;
    if (m.drag) send({ t: 'mup', ...at(e) });
    else if (performance.now() - m.t0 >= HOLD_MS) send({ t: 'click', ...m.start, b: 'right' });
    else send({ t: 'click', ...m.start });
  }
  canvas.addEventListener('pointerleave', () => { if (dex && !mouse) cursor.classList.remove('on'); });

  canvas.addEventListener('pointerdown', e => {
    if (dex) return dexDown(e);
    if (e.button !== 0) return;
    canvas.setPointerCapture(e.pointerId);
    stroke = { pts: [norm(e)], x: e.clientX, y: e.clientY, t0: performance.now(), moved: false, last: 0 };
  });
  canvas.addEventListener('pointermove', e => {
    if (dex) return dexMove(e);
    if (!stroke) return;
    if (Math.hypot(e.clientX - stroke.x, e.clientY - stroke.y) > 8) stroke.moved = true;
    const now = performance.now();
    if (stroke.moved && now - stroke.last > 16) { stroke.pts.push(norm(e)); stroke.last = now; }
  });
  canvas.addEventListener('pointerup', e => {
    if (dex) return dexUp(e);
    if (!stroke) return;
    const s = stroke; stroke = null;
    const ms = Math.round(performance.now() - s.t0);
    const [x, y] = s.pts[0];
    if (!s.moved) {
      send(ms > 450 ? { t: 'press', x, y, ms: Math.max(ms, 600) } : { t: 'tap', x, y });
      return;
    }
    s.pts.push(norm(e));
    // Keep gestures small: at most 60 points.
    const step = Math.max(1, Math.ceil(s.pts.length / 60));
    const pts = s.pts.filter((_, i) => i % step === 0 || i === s.pts.length - 1);
    send({ t: 'swipe', pts, ms: Math.min(Math.max(ms, 80), 4000) });
  });
  canvas.addEventListener('pointercancel', e => {
    stroke = null;
    if (dex && mouse) { if (mouse.drag) send({ t: 'mup', ...at(e) }); mouse = null; cursor.classList.remove('hold'); }
  });
  // On DeX the right button is handled in pointerdown, so the menu event is just swallowed.
  canvas.addEventListener('contextmenu', e => { e.preventDefault(); if (!dex) send({ t: 'key', k: 'back' }); });

  // Thumbstick / mouse wheel scrolls the phone with a short swipe (on DeX, real wheel steps).
  let wheelAt = 0;
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const now = performance.now();
    if (dex) {
      if (now - wheelAt < 60 || !e.deltaY) return;
      wheelAt = now;
      moveCursor(e);
      return send({ t: 'scroll', ...at(e), v: -Math.sign(e.deltaY) });
    }
    if (now - wheelAt < 250 || !e.deltaY) return;
    wheelAt = now;
    const [x, y] = norm(e);
    const dy = Math.sign(e.deltaY) * 0.25;
    const y0 = Math.min(0.85, Math.max(0.15, y));
    send({ t: 'swipe', pts: [[x, y0], [x, Math.min(0.95, Math.max(0.05, y0 - dy))]], ms: 180 });
  }, { passive: false });

  document.querySelectorAll('[data-key]').forEach(b => b.addEventListener('click', () => send({ t: 'key', k: b.dataset.key })));
  document.querySelectorAll('[data-send]').forEach(b => b.addEventListener('click', () => send({ t: b.dataset.send })));

  const typebar = document.getElementById('typebar'), text = document.getElementById('text');
  document.getElementById('kbd').addEventListener('click', () => {
    typebar.classList.toggle('open');
    layout();
    if (typebar.classList.contains('open')) text.focus();
  });
  text.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (text.value) { send({ t: 'text', s: text.value }); text.value = ''; }
      else send({ t: 'enter' });
    }
  });

  document.getElementById('full').addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  });
  document.addEventListener('fullscreenchange', () => setTimeout(layout, 50));

  // The Quest app's panel is already its own window, so full screen does nothing useful there.
  if (/PocketPortalQuest/.test(navigator.userAgent)) document.getElementById('full').remove();

  if (location.hash) history.replaceState(null, '', location.pathname);
  connect();
})();
</script>
</body>
</html>
